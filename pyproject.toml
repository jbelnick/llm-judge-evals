[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-judge-evals"
version = "0.1.0"
description = "Deterministic scorers plus a rubric-anchored LLM judge with a CI regression gate for AI summary workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jason Belnick" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
